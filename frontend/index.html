<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>GreenGo</title>
    <script>
      // Early global diagnostics store setup (catches parsing syntax errors before module scripts parse)
      window.diagnostics = {
        logs: ["[LOG] HTML head inline script initialized"],
        errors: [],
        reactStarted: false,
        userLayoutMounted: "NO",
        adminLayoutMounted: "NO",
        userDashboardMounted: "NO",
        adminDashboardMounted: "NO",
        currentRoute: window.location.pathname + window.location.hash,
        tokenExists: !!localStorage.getItem("token"),
        userObject: "none",
        loadingState: "HTML Init",
        addLog: function(msg) {
          console.log("[DIAG_LOG] " + msg);
          this.logs.push("[LOG] " + msg);
          if (window.updateDiagnosticsUI) {
            window.updateDiagnosticsUI();
          }
        },
        addError: function(err) {
          console.error("[DIAG_ERR] " + err);
          this.errors.push("[ERR] " + err);
          if (window.updateDiagnosticsUI) {
            window.updateDiagnosticsUI();
          }
          var errStr = "";
          if (err) {
            if (typeof err === "string") {
              errStr = err;
            } else if (err.message) {
              errStr = err.message;
            } else {
              try {
                errStr = JSON.stringify(err);
              } catch(e) {
                errStr = String(err);
              }
            }
          }
          var isRoutineAuthOrNetworkError = errStr && (
            errStr.indexOf("Verification failed") > -1 || 
            errStr.indexOf("401") > -1 || 
            errStr.indexOf("403") > -1 || 
            errStr.indexOf("No token found") > -1 || 
            errStr.indexOf("failed: status") > -1 ||
            errStr.indexOf("Failed to fetch") > -1 ||
            errStr.indexOf("NetworkError") > -1 ||
            errStr.indexOf("network error") > -1 ||
            errStr.indexOf("loadAdmin exception") > -1 ||
            errStr.indexOf("loadUser exception") > -1 ||
            errStr.indexOf("load error") > -1 ||
            errStr.indexOf("load admin details error") > -1 ||
            errStr.indexOf("token decode crash") > -1 ||
            errStr.indexOf("React Error Boundary") > -1 ||
            this.reactStarted === true
          );
          if (!isRoutineAuthOrNetworkError) {
            showFallbackError(errStr);
          }
        }
      };

      window.onerror = function (message, source, lineno, colno, error) {
        var errMsg = message + " (at " + source + ":" + lineno + ":" + colno + ")";
        if (error && error.stack) {
          errMsg += "\nStack: " + error.stack;
        }
        window.diagnostics.addError(errMsg);
        return false;
      };

      window.onunhandledrejection = function (event) {
        var reason = event.reason;
        var errMsg = "Unhandled Rejection: " + (reason ? (reason.stack || reason.message || JSON.stringify(reason)) : event);
        window.diagnostics.addError(errMsg);
      };

      function showFallbackError(err) {
        var errDiv = document.getElementById("fallback-error-overlay");
        if (!errDiv) {
          errDiv = document.createElement("div");
          errDiv.id = "fallback-error-overlay";
          errDiv.style.position = "fixed";
          errDiv.style.top = "0";
          errDiv.style.left = "0";
          errDiv.style.right = "0";
          errDiv.style.bottom = "0";
          errDiv.style.background = "rgb(180, 0, 0)";
          errDiv.style.color = "white";
          errDiv.style.fontFamily = "monospace";
          errDiv.style.padding = "24px";
          errDiv.style.zIndex = "999999";
          errDiv.style.overflow = "auto";
          errDiv.style.boxSizing = "border-box";
          
          var title = document.createElement("h2");
          title.innerText = "🚨 WebView Parsing/Syntax Exception";
          title.style.margin = "0 0 10px 0";
          errDiv.appendChild(title);
          
          var sub = document.createElement("p");
          sub.innerText = "The following error occurred before React finished loading. This usually means a bundle syntax error in this WebView version:";
          sub.style.margin = "0 0 20px 0";
          errDiv.appendChild(sub);

          var pre = document.createElement("pre");
          pre.id = "fallback-error-pre";
          pre.style.background = "black";
          pre.style.padding = "15px";
          pre.style.borderRadius = "8px";
          pre.style.whiteSpace = "pre-wrap";
          pre.style.wordBreak = "break-all";
          pre.style.fontSize = "12px";
          pre.style.lineHeight = "1.5";
          errDiv.appendChild(pre);

          var btn = document.createElement("button");
          btn.innerText = "Clear LocalStorage & Refresh";
          btn.style.marginTop = "20px";
          btn.style.padding = "12px 24px";
          btn.style.background = "orange";
          btn.style.border = "none";
          btn.style.color = "black";
          btn.style.fontWeight = "bold";
          btn.style.borderRadius = "6px";
          btn.style.cursor = "pointer";
          btn.onclick = function() {
            localStorage.clear();
            window.location.reload();
          };
          errDiv.appendChild(btn);

          document.body.appendChild(errDiv);
        }
        document.getElementById("fallback-error-pre").innerText += err + "\n\n";
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; background-color: #1faf38; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; color: white; z-index: 99999;">
        <h1 style="font-size: 3rem; font-weight: 900; margin: 0 0 8px 0; letter-spacing: -0.02em;">GreenGo</h1>
        <p style="font-size: 0.75rem; font-weight: 700; color: rgba(255, 255, 255, 0.85); letter-spacing: 0.1em; margin: 0 0 32px 0; text-transform: uppercase;">Delivering Happiness</p>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 0.75rem; font-weight: 700; background-color: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); padding: 10px 18px; border-radius: 9999px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
          <div style="width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <span>Loading...</span>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
